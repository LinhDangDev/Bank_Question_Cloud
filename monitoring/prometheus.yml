# Prometheus Configuration for Question Bank System

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'question-bank-production'
    environment: 'production'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: /api/metrics

  - job_name: 'question-bank-backend'
    static_configs:
      - targets: ['backend:3001']
    scrape_interval: 15s
    metrics_path: /api/metrics
    scrape_timeout: 10s
